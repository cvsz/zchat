services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run python -m camfrog_control_server.local_setup before a new local stack}
      POSTGRES_USER: ${POSTGRES_USER:?Run python -m camfrog_control_server.local_setup before a new local stack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python -m camfrog_control_server.local_setup before a new local stack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  control-server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Run python -m camfrog_control_server.local_setup before a new local stack}
      CONTROL_ADMIN_TOKEN: ${CONTROL_ADMIN_TOKEN:?Run python -m camfrog_control_server.local_setup before a new local stack}
      CONTROL_JWT_SECRET: ${CONTROL_JWT_SECRET:?Run python -m camfrog_control_server.local_setup before a new local stack}
      CONTROL_ZWORKFORCE_INTEGRATION_TOKEN: ${CONTROL_ZWORKFORCE_INTEGRATION_TOKEN:-}
      CONTROL_DOCS_ENABLED: ${CONTROL_DOCS_ENABLED:?Run python -m camfrog_control_server.local_setup before a new local stack}
      CONTROL_COMMAND_LEASE_SECONDS: ${CONTROL_COMMAND_LEASE_SECONDS:?Run python -m camfrog_control_server.local_setup before a new local stack}
      CONTROL_COMMAND_MAX_ATTEMPTS: ${CONTROL_COMMAND_MAX_ATTEMPTS:?Run python -m camfrog_control_server.local_setup before a new local stack}
      CONTROL_DASHBOARD_JWT_TTL: ${CONTROL_DASHBOARD_JWT_TTL:?Run python -m camfrog_control_server.local_setup before a new local stack}
      CONTROL_API_RATE_LIMIT: ${CONTROL_API_RATE_LIMIT:?Run python -m camfrog_control_server.local_setup before a new local stack}
      CONTROL_AUTH_RATE_LIMIT: ${CONTROL_AUTH_RATE_LIMIT:?Run python -m camfrog_control_server.local_setup before a new local stack}
    ports:
      - "127.0.0.1:8000:8000"
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn camfrog_control_server.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  postgres_data:
