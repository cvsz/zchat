name: windows-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure C++20 compact adapter
        run: cmake -S tools/zchat-compact-adapter -B build/zchat-compact-adapter -A x64
      - name: Build C++20 compact adapter
        run: cmake --build build/zchat-compact-adapter --config Release
      - name: Run compact adapter CTest
        run: ctest --test-dir build/zchat-compact-adapter -C Release --output-on-failure
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest windows_tests tests -rs -v --junitxml=junit.xml --log-file=pytest.log --log-file-level=DEBUG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-logs
          path: |
            junit.xml
            pytest.log