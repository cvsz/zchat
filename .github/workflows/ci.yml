name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: python scripts/validate_repo.py
      - run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: pip install -r zchat-client/requirements.txt
      - run: python -m pip_audit -r requirements-dev.txt
      - run: python -m py_compile src/camfrog/camfrog_auto.py src/camfrog/camfrog_gui.py src/features/camfrog_status_gui.py src/camfrog/camfrog_windows_runtime.py src/camfrog/camfrog_status_engine.py src/features/camfrog_private_chat_gui.py src/features/camfrog_music_gui.py src/camfrog/camfrog_presence.py src/features/status_changer_gui.py src/features/room_control_gui.py src/features/im_autoreply_gui.py src/features/status_random_gui.py src/features/status_marquee_gui.py src/features/chat_im_private_gui.py src/camfrog/camfrog_tray.py src/camfrog/clipboard_support.py src/features/room_control_entry.py src/features/chat_im_private_entry.py src/features/status_random_entry.py src/features/status_marquee_entry.py src/features/status_changer_entry.py src/features/im_autoreply_entry.py src/features/music_dj_entry.py src/features/web_status_entry.py src/features/name_color_changer_entry.py src/features/name_color_changer_gui.py src/features/icon_changer_entry.py src/features/icon_changer_gui.py src/features/name_changer_entry.py src/features/name_changer_gui.py tools/web_status.py line/*.py
      - run: PYTHONPATH=src/camfrog:src/features python src/camfrog/camfrog_auto.py check --config config.example.json
      - run: PYTHONPATH=src/camfrog:src/features python src/camfrog/camfrog_auto.py --lang th check --config config.example.json
      - run: PYTHONPATH=src/camfrog:src/features xvfb-run -a pytest -q tests
      - run: python -m unittest discover -s line/tests -v
      - run: PYTHONPATH=zchat-client/src:control-server/src xvfb-run -a pytest -q zchat-client/tests
  control-server:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: control-server
    steps:
      - uses: actions/checkout@3d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,lint]'
      - run: python -m pip install 'pip-audit>=2.7,<3'
      - run: python -m pip_audit --local --skip-editable
      - run: ruff format --check src tests ../zchat-client/src ../zchat-client/tests
      - run: ruff check src tests ../zchat-client/src ../zchat-client/tests
      - run: pytest -q
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Audit Windows build dependencies
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pip-audit>=2.7,<3'
          python -m pip_audit -r line/requirements-build.txt
          python -m pip_audit -r zchat-client/requirements-build.txt
      - name: Build and run Windows integration tests
        run: .\full-build.bat
        shell: cmd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camfrog-apps-windows
          path: |
            dist/
            camfrog-features-windows.zip
            line/dist/line-status-changer.exe
            line/dist/SHA256SUMS.txt
          if-no-files-found: error

  # Workflow-level status check for branch protection
  ci:
    needs: [test, control-server, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 1
    steps:
      - name: CI gate passed
        run: echo "All required checks passed"